# Local HTTP entry point; production uses production.conf.template with TLS/HSTS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
log_format safe '$request_id $request_method $status $request_time';
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;
    access_log /var/log/nginx/access.log safe;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $frontend http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Discard user-supplied forwarding headers at the only public ingress.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded '';
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    location = /nginx-health { access_log off; return 200 'ok'; }
    location /api/ { proxy_pass $backend; }
    location = /docs { proxy_pass $backend; }
    location = /openapi.json { proxy_pass $backend; }
    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass $frontend;
    }
}
